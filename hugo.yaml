# Hugo configuration file
title: Salusa

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

outputFormats:
  MARKDOWN:
    mediaType: text/markdown
    baseName: index
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - MARKDOWN
  page:
    - HTML
    - MARKDOWN
  section:
    - HTML
    - MARKDOWN

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true
      # render markdown content as xhtml
      xhtml: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs/getting-started
      weight: 1
    - name: About
      pageRef: /about
      weight: 2
    - name: Contact ↗
      url: "https://github.com/abibby"
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/gosalusa/framework"
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/salusa.svg

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/gosalusa/docs/edit/main/content"
